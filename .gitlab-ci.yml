# Temporary GitLab CI for the internal review. The reference CI lives in .github/workflows (GitHub Actions).
# Integration specs (Testcontainers) skip themselves when Docker is unavailable on the runner.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

default:
  # Public image: the iperia CI image lives in a registry this project cannot pull from.
  image: eclipse-temurin:21-jdk
  tags:
    - "aws"
    - "docker"
    - "ekino"
    - "france"

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

cache:
  key:
    files:
      - gradle/libs.versions.toml
      - gradle/wrapper/gradle-wrapper.properties
  paths:
    - .gradle-home/caches
    - .gradle-home/wrapper
    - .gradle-home/jdks

stages:
  - build
  - deploy

build:
  stage: build
  before_script:
    # Node is needed by Spotless (prettier for Markdown/YAML)
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends nodejs npm > /dev/null
  script:
    - chmod +x ./gradlew
    - ./gradlew build --console=plain
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: build/test-results/test/TEST-*.xml
    paths:
      - build/reports/

# GitLab Pages: the Quarkdown documentation site, published from main only.
pages:
  stage: deploy
  variables:
    QUARKDOWN_VERSION: "2.6.0"
    GIT_DEPTH: 0 # tags are needed to stamp the docs with the latest release
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl unzip git > /dev/null
    - curl -fsSL -o /tmp/quarkdown.zip "https://github.com/iamgio/quarkdown/releases/download/v${QUARKDOWN_VERSION}/quarkdown-linux-x64.zip"
    - unzip -q /tmp/quarkdown.zip -d /tmp/qd
  script:
    - VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//') || true
    - if [ -n "$VERSION" ]; then echo ".var {karboneversion} {$VERSION}" > docs/_version.qd; else echo "no tag found, keeping the committed docs version"; fi
    - /tmp/qd/quarkdown/bin/quarkdown c docs/main.qd -o build/docs --clean
    - chmod +x ./gradlew && ./gradlew dokkaGenerate --console=plain
    - rm -rf public && mv build/docs/Karbone public && cp -r build/dokka/html public/api
  artifacts:
    paths:
      - public

# Internal review: publish to this project's GitLab Package Registry.
# - on a v* tag: the release version (v0.1.0 -> 0.1.0)
# - on main: manual job, publishes the localVersion snapshot from gradle.properties
publish:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends nodejs npm > /dev/null
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then VERSION="${CI_COMMIT_TAG#v}"; else VERSION=$(grep '^localVersion=' gradle.properties | cut -d= -f2); fi
      echo "Publishing com.ekino.oss:karbone:$VERSION to the GitLab Package Registry"
      chmod +x ./gradlew
      ./gradlew publishAllPublicationsToGitLabRepository -PlocalVersion="$VERSION" --console=plain
