# Temporary GitLab CI for the internal review. The reference CI lives in .github/workflows (GitHub Actions).
# Integration specs (Testcontainers) skip themselves when Docker is unavailable on the runner.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

default:
  # Public image: the iperia CI image lives in a registry this project cannot pull from.
  image: eclipse-temurin:21-jdk
  tags:
    - "aws"
    - "docker"
    - "ekino"
    - "france"

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

cache:
  key:
    files:
      - gradle/libs.versions.toml
      - gradle/wrapper/gradle-wrapper.properties
  paths:
    - .gradle-home/caches
    - .gradle-home/wrapper
    - .gradle-home/jdks

stages:
  - build
  - deploy

build:
  stage: build
  before_script:
    # Node is needed by Spotless (prettier for Markdown/YAML)
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends nodejs npm > /dev/null
  script:
    - chmod +x ./gradlew
    - ./gradlew build --console=plain
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: build/test-results/test/TEST-*.xml
    paths:
      - build/reports/

# GitLab Pages: the Quarkdown documentation site, published from main only.
pages:
  stage: deploy
  variables:
    QUARKDOWN_VERSION: "2.6.0"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl unzip > /dev/null
    - curl -fsSL -o /tmp/quarkdown.zip "https://github.com/iamgio/quarkdown/releases/download/v${QUARKDOWN_VERSION}/quarkdown-linux-x64.zip"
    - unzip -q /tmp/quarkdown.zip -d /tmp/qd
  script:
    - /tmp/qd/quarkdown/bin/quarkdown c docs/main.qd -o build/docs --clean
    - rm -rf public && mv build/docs/Karbone public
  artifacts:
    paths:
      - public
