name: Manual Publish (Snapshot)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: "corretto"
          java-version: "21"

      - name: Setup Node.js (for prettier)
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Calculate snapshot version
        id: version
        run: |
          VERSION=$(git describe --tags --always --dirty --abbrev=7)
          echo "snapshot_version=${VERSION#v}-SNAPSHOT" >> $GITHUB_OUTPUT

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Publish snapshot to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
        run: ./gradlew publish --no-daemon --stacktrace

      - name: Summary
        run: |
          {
            echo "## Snapshot published"
            echo
            echo "**Version**: \`${{ steps.version.outputs.snapshot_version }}\`"
            echo
            echo '```kotlin'
            echo "repositories {"
            echo "    mavenCentral()"
            echo "    maven { url = uri(\"https://central.sonatype.com/repository/maven-snapshots/\") }"
            echo "}"
            echo "dependencies {"
            echo "    implementation(\"com.ekino.oss:karbone:${{ steps.version.outputs.snapshot_version }}\")"
            echo "}"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
