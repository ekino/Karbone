name: Build and Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history for git describe

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: "corretto"
          java-version: "21"

      - name: Setup Node.js (for prettier)
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build (compile, spotlessCheck, detekt)
        run: ./gradlew build -x test

      - name: Run tests
        env:
          # Optional: enables CarboneCloudSpec against api.carbone.io with a *test* key. Skipped when absent.
          CARBONE_TEST_API_KEY: ${{ secrets.CARBONE_TEST_API_KEY }}
        run: ./gradlew test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            build/test-results/**/*.xml
            build/reports/
          retention-days: 7

      - name: Publish test report
        uses: dorny/test-reporter@v3
        # Skip for Dependabot PRs due to restricted permissions
        if: always() && github.actor != 'dependabot[bot]'
        with:
          name: Test Results
          path: "build/test-results/test/TEST-*.xml"
          reporter: java-junit
