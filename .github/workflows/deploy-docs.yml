name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: "21"

      - name: Set up Quarkdown
        uses: quarkdown-labs/setup-quarkdown@v1
        with:
          quarkdown-version: "2.6.0"

      - name: Refuse to deploy the temporary development docs publicly
        run: |
          if [ -d docs/dev ] || grep -q "_dev-nav" docs/_nav.qd; then
            echo "docs/dev/ (internal review notes) must be removed before deploying to GitHub Pages"; exit 1
          fi

      - name: Build site with Quarkdown
        run: quarkdown c docs/main.qd -o build/docs --clean

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Quarkdown nests the output under a directory named after .docname
          path: build/docs/Karbone

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
